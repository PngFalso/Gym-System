<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Usuario</title>
</head>
<body  style="background-color: rgb(34, 27, 27);">

<h1 style="text-align: center;margin-top: 40px;font-size: 35px;color:white">Cadastro usuário</h1>

<!--todas as colunas -->
<div style="width: 900px; margin-left: 300px; display: flex; justify-content: space-between; color: white";>

<!--colunas da esquerda -->
<div style="margin-left: 0px;">

<div style=" margin-top: 0px;">

    <label for="nome" style="font-size: 25px; margin-left: 95px; margin-top: 10px; font-weight: bold;">Nome completo</label>

    <br>

    <input type="text" id="nome" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 40px;">

    <label for="data nascimento" style="font-size: 25px; margin-left: 80px; font-weight: bold;">Data de nascimento</label>
    
    <br>

    <input type="date" id="data" style="font-size: 20px; margin-left: 0px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 40px;">

    <label for="telefone" style="font-size: 25px; margin-left: 130px;margin-top: 10px; font-weight: bold;">telefone</label>
    
    <br>

    <input type="tel" id="telefone" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 40px;">

    <label for="genero" style="font-size: 25px; margin-left: 130px; font-weight: bold;">genero</label>
    
    <br>

    <input type="text" id="genero" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>
</div>
<br>

<!--colunas da direita-->
<div style="margin-left: 100px; margin-top: 0px;">

<div style=" margin-left: 100px; margin-top: 0px;">

    <label for="email" style="font-size: 25px; margin-left: 135px; font-weight: bold;">e-mail</label>

    <br>

    <input type="e-mail" id="e-mail" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 40px;">

    <label for="cpf" style="font-size: 25px; margin-left: 150px; font-weight: bold;">cpf</label>
    
    <br>

    <input type="number" id="cpf" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 40px;">

    <label for="senha" style="font-size: 25px; margin-left: 130px; font-weight: bold;">senha</label>
    
    <br>

    <input type="password" id="senha" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 40px;">

    <label for="endereço" style="font-size: 25px; margin-left: 130px; font-weight: bold;">endereço</label>
    
    <br>

    <input type="text" id="endereço" style="font-size: 20px; margin-left: 0px; margin-top: 10px; padding: 5px; width: 340px;">
</div>
</div>
</div>
<div style="margin-left: 640px; margin-top: 80px;">
    <button type="submit" style="background-color: #42444d; color:white; border:none; font-size: 30px; font-weight: bold; padding: 12px 40px; border-radius: 6px; cursor: pointer;">
        Confirmar
    </button>
</div>

</div>
</body>
</body>
</html>
