<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Usuario</title>
</head>
<body  style="background-color: rgb(68, 87, 96);">

<h1 style="text-align: center; margin-top: 40px;font-size: 40px;color:rgb(79, 223, 255)">Cadastro usuário</h1>


<div style="width: 900px; margin-left: 200px; margin-top: 40px; display: flex; justify-content: space-between;">

<div style="margin-left: 0px;">

<div style=" margin-top: 10px;">

    <label for="nome" style="font-size: 25px; margin-left: 95px; color: rgb(79, 223, 255); font-weight: bold;">Nome completo</label>

    <br>

    <input type="text" id="nome" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 70px;">

    <label for="data nascimento" style="font-size: 25px; margin-left: 80px; color: rgb(79, 223, 255); font-weight: bold;">Data de nascimento</label>
    
    <br>

    <input type="date" id="data" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 70px;">

    <label for="telefone" style="font-size: 25px; margin-left: 130px; color: rgb(79, 223, 255); font-weight: bold;">telefone</label>
    
    <br>

    <input type="tel" id="telefone" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 70px;">

    <label for="genero" style="font-size: 25px; margin-left: 130px; color: rgb(79, 223, 255); font-weight: bold;">genero</label>
    
    <br>

    <input type="text" id="genero" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>
</div>
<br>

<div style="margin-left: 300px; margin-top: 12px;">

<div style=" margin-left: 100px; margin-top: 0px;">

    <label for="email" style="font-size: 25px; margin-left: 135px; color: rgb(79, 223, 255); font-weight: bold;">e-mail</label>

    <br>

    <input type="e-mail" id="e-mail" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 70px;">

    <label for="cpf" style="font-size: 25px; margin-left: 150px; color: rgb(79, 223, 255); font-weight: bold;">cpf</label>
    
    <br>

    <input type="number" id="cpf" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 70px;">

    <label for="senha" style="font-size: 25px; margin-left: 130px; color: rgb(79, 223, 255); font-weight: bold;">senha</label>
    
    <br>

    <input type="password" id="senha" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>

<div style=" margin-left: 100px; margin-top: 70px;">

    <label for="endereço" style="font-size: 25px; margin-left: 130px; color: rgb(79, 223, 255); font-weight: bold;">endereço</label>
    
    <br>

    <input type="text" id="endereço" style="font-size: 18px; margin-left: 0px; margin-top: 25px; padding: 5px; width: 340px;">
</div>
</div>
</div>

<div style="margin-left: 620px; margin-top: -40px;">
    <button type="submit" style="background-color: #1331d8; color:white; border:none; font-size: 20px; font-weight: bold; padding: 12px 40px; border-radius: 6px; cursor: pointer;">
        Confirmar Cadastro
    </button>
</div>

<div style="margin-left: 1350px; margin-top: -40px;">
    <button type="submit" style="background-color: #1331d8; border: none; color:white; font-size: 15px; font-weight: bold; padding: 10px 5px; border-radius: 0px; cursor: pointer;">
        cadastro prof
    </button>
</div>
</body>
</body>
</html>
