<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Usuario</title>
</head>
<body  style="background-color: rgb(34, 27, 27);">

<h1 style="text-align: center;margin-top: 40px;font-size: 50px;color:white">Login usuário</h1>

<div style="background-color: rgba(107, 93, 93, 0.25); padding: 30px; border-radius: 10px; width: 400px; margin: 20px auto;">

<!--todas as colunas -->
<div style="width: 100%; display: block; justify-content: space-between; color: white";>

    <label for="e-mail" style="font-size: 35px; margin-left: 145px;display: block; margin-top: 40px; font-weight: bold;">e-mail</label>

    <br>

    <input type="text" id="e-mail" style="font-size: 20px; margin-left: 20px; margin-top: 5px; padding: 5px; width: 340px;">
</div>

<div style=" margin-top: 100px;">

    <label for="senha" style="font-size: 35px; margin-left: 145px; font-weight: bold;color: white;">Senha</label>
    
    <br>

    <input type="password" id="senha" style="font-size: 20px; margin-left: 20px; margin-top: 20px; padding: 5px; width: 340px;">
</div>

<div style="margin-left: 85px; margin-top: 110px;">
    <button type="submit" style="background-color: #42444d; color:white; border:none; font-size: 30px; font-weight: bold; padding: 12px 40px; border-radius: 6px; cursor: pointer;">
        Confirmar
    </button>
</div>
</div>
</div>
</body>
</body>
</html>
